# Prompt-sensitivity variant sweep (architecture.md §5, sprints/sprint4.md
# Phase 4.3). Final checkpoints only ("main") to keep this cheap — the
# question is format sensitivity per model size, not across training, so the
# intermediate-checkpoint axis from sweeps/main.yaml is dropped here.
#
# Targets: arc_easy x 4 variants (letter / option_text / letter_instr /
# letter_5shot) + mmlu x 2 variants (letter / option_text). arc_easy/mc_letter_v1
# and mmlu/mc_letter_v1 at "main" are already paid for by sweeps/main.yaml —
# the prediction cache (architecture.md §7) makes those rows free to
# re-request here, so results/figures can read this sweep's DB rows without a
# second real inference pass for the letter variants.
#
# arc_easy/mc_letter_5shot_v1 (Phase 4.1) added here once authored — this was
# an additive re-run (resumable sweep, no redo of the first 5 targets'
# already-`done` rows), not a rewrite (sprints/sprint4.md Phase 4.3).

models:
  - model_id: pythia-70m
    revisions: [main]
  - model_id: pythia-160m
    revisions: [main]
  - model_id: pythia-410m
    revisions: [main]
  - model_id: pythia-1b
    revisions: [main]

targets:
  - dataset: arc_easy
    variant: arc_easy/mc_letter_v1
    evaluator: loglik_mc
    split: test
  - dataset: arc_easy
    variant: arc_easy/mc_option_text_v1
    evaluator: loglik_mc
    split: test
  - dataset: arc_easy
    variant: arc_easy/mc_letter_instr_v1
    evaluator: loglik_mc
    split: test
  - dataset: arc_easy
    variant: arc_easy/mc_letter_5shot_v1
    evaluator: loglik_mc
    split: test
  - dataset: mmlu
    variant: mmlu/mc_letter_v1
    evaluator: loglik_mc
    split: test
  - dataset: mmlu
    variant: mmlu/mc_option_text_v1
    evaluator: loglik_mc
    split: test

limit: 500
seed: 0
