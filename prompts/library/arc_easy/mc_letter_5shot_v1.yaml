id: arc_easy/mc_letter_5shot_v1
task_family: mc
template: |
  Question: {question}
  {lettered_choices}
  Answer:
continuation_style: letter      # letter (" A".." D") | option_text (full option strings)
num_fewshot: 5
fewshot_split: train             # fixture tier: split="fixture_train" (see datasets.py)
fewshot_seed: 0
